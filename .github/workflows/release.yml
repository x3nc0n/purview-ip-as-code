name: Publish scanner release assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    environment:
      name: scanner-release-approval
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned Python validator
        run: python -m pip install -r requirements-dev.txt

      - name: Install pinned PowerShell test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run offline release gates
        shell: pwsh
        run: |
          python scripts/validate-json.py
          if ($LASTEXITCODE -ne 0) { throw 'Configuration schema validation failed.' }
          python scripts/validate-infrastructure-plan.py
          if ($LASTEXITCODE -ne 0) { throw 'Infrastructure plan validation failed.' }
          ./scripts/Test-Configuration.ps1
          ./scripts/Build-RulePackage.ps1
          ./scripts/Invoke-DetectionTests.ps1
          Invoke-Pester -Path tests -CI
          $diagnostics = @()
          foreach ($path in @('src', 'scripts', 'extensions/scanner/scripts')) {
            $diagnostics += @(Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error, Warning)
          }
          if ($diagnostics) { $diagnostics | Format-Table -AutoSize | Out-String | Write-Error }

      - name: Build public assets
        shell: pwsh
        run: |
          az bicep install
          if ($LASTEXITCODE -ne 0) { throw 'Bicep installation failed.' }
          ./extensions/scanner/scripts/New-ScannerReleaseAssets.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'release-assets')

      - name: Publish immutable tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          gh release create $env:GITHUB_REF_NAME `
            (Join-Path $assetDirectory 'azuredeploy.json') `
            (Join-Path $assetDirectory 'Invoke-LabBootstrap.ps1') `
            (Join-Path $assetDirectory 'demo-content.zip') `
            (Join-Path $assetDirectory 'SHA256SUMS.txt') `
            --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
