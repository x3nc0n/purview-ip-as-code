name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned Python validator
        run: python -m pip install -r requirements-dev.txt

      - name: Install pinned PowerShell test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Validate schemas and approved infrastructure plan
        shell: pwsh
        run: |
          python scripts/validate-json.py
          if ($LASTEXITCODE -ne 0) { throw 'Configuration schema validation failed.' }
          python scripts/validate-infrastructure-plan.py
          if ($LASTEXITCODE -ne 0) { throw 'Infrastructure plan validation failed.' }
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generator regression tests failed.' }

      - name: Validate PowerShell, SIT XML, and synthetic fixtures
        shell: pwsh
        run: |
          az bicep install --version v0.46.1
          if ($LASTEXITCODE -ne 0) { throw 'Bicep installation failed.' }
          ./scripts/Test-Configuration.ps1
          ./scripts/Build-RulePackage.ps1
          ./scripts/Invoke-DetectionTests.ps1
          Invoke-Pester -Path tests -CI

      - name: Analyze all PowerShell
        shell: pwsh
        run: |
          $diagnostics = @()
          foreach ($path in @('src', 'scripts', 'extensions/scanner/scripts')) {
            $diagnostics += @(Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error, Warning)
          }
          if ($diagnostics) {
            $diagnostics | Format-Table -AutoSize | Out-String | Write-Error
          }

      - name: Compile and verify committed ARM JSON
        shell: pwsh
        run: |
          az bicep build --file extensions/scanner/infra/main.bicep --outfile $env:RUNNER_TEMP/azuredeploy.json
          if ($LASTEXITCODE -ne 0) { throw 'Bicep compilation failed.' }
          $compiled = [System.IO.File]::ReadAllBytes((Join-Path $env:RUNNER_TEMP 'azuredeploy.json'))
          $committed = [System.IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE 'extensions\scanner\infra\azuredeploy.json'))
          if ([Convert]::ToBase64String($compiled) -ne [Convert]::ToBase64String($committed)) {
            throw 'Compiled ARM JSON differs from the committed release template.'
          }
          az bicep build --file extensions/scanner/infra/connect-existing-files.bicep --outfile $env:RUNNER_TEMP/connect-existing-files.json
          if ($LASTEXITCODE -ne 0) { throw 'Existing Azure Files connection template compilation failed.' }
          az bicep build --file extensions/scanner/infra/tiny-windows-vm.bicep --outfile $env:RUNNER_TEMP/tiny-windows-vm.json
          if ($LASTEXITCODE -ne 0) { throw 'Tiny Windows VM template compilation failed.' }
          az bicep build --file extensions/scanner/infra/ad-data-disk.bicep --outfile $env:RUNNER_TEMP/ad-data-disk.json
          if ($LASTEXITCODE -ne 0) { throw 'AD data disk template compilation failed.' }
